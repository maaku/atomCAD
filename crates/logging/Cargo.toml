[package]
name = "atomcad-logging"
version = "0.1.0"
publish = false
authors = ["Machine Phase Systems <hello@machinephase.systems>"]
license = "MPL-2.0"
edition = "2021"

[dependencies]
# atomCAD
app = { workspace = true }
# Logging
log = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# Logging
env_logger = "0.11"

[target.'cfg(target_family = "wasm")'.dependencies]
# Logging
console_log = "1.0.0"
